# 闸门的 CI 落点（Trust v2）：
# pre-commit/pre-push 可被 --no-verify 跳过、也只装在跑过 install 的机器上 ——
# CI 正面执行不依赖 /mnt/hdd 部署树的 Trust v2 闸门与本仓专属检查。
#
# 跳过说明（不假装查过）：
#   · check_facts_replay.py 依赖 /mnt/hdd/octave-wasm-build/ 部署树与产物 ⇒ CI 标为 SKIP，
#     同时照跑 check_facts_replay.py --selftest；
#   · check_stale.py 依赖本地时效窗口 ⇒ CI 不跑；
#   · witness-upstream-pin.py / plugin-check.py 依赖容器或部署树 ⇒ CI 不跑。
name: gates
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: Install runner-side gate dependencies
        run: |
          pip install zstandard brotli cryptography ruff
          npm install -g typescript@5
          sudo apt-get update -qq && sudo apt-get install -y -qq octave
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Run Trust v2 and repo commit gates
        shell: bash
        run: |
          set -e
          git add -A
          python3 zreflect/registry.py --verify-seal
          python3 zreflect/facts.py --check
          python3 .githooks/check-wants.py
          python3 .githooks/check-whitelist.py
          python3 .githooks/check-consistency.py
          python3 .githooks/check-readiness-pattern.py
          for g in check_facts.py check_history.py check_i18n.py check_invariants.py \
                   check_lint.py check_questions.py check_readme_sync.py \
                   check_retractions.py check_snapshots.py check_explain.py; do
            python3 "zreflect/$g"
          done
          echo "SKIP: zreflect/check_facts_replay.py (requires /mnt/hdd deploy tree)"
          python3 zreflect/check_facts_replay.py --selftest
          python3 -m ruff check zreflect reflect-local

      - name: Selftest suites (clean env)
        shell: bash
        run: |
          python3 zreflect/harness.py
          sh build/gates-selftest.sh
