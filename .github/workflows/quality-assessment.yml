name: Code quality assessment

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  assess:
    name: Assess ${{ github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install gate dependencies
        run: |
          pip install zstandard brotli cryptography ruff
          npm install --prefix /tmp/ts typescript@5 --no-save

      - name: Run checks
        shell: bash
        run: |
          set +e
          export PATH="/tmp/ts/node_modules/.bin:$PATH"
          : > results.tsv
          any_fail=0
          run_one() {
            n="$1"; shift
            printf '%s\t%s\t' "$n" "$*" >> results.tsv
            "$@" > "/tmp/$n.log" 2>&1
            rc=$?
            printf '%s\n' "$rc" >> results.tsv
            printf '  %s: rc=%s\n' "$n" "$rc"
            if [ "$rc" -ne 0 ]; then
              any_fail=1
              cat "/tmp/$n.log"
            fi
          }

          run_one verify-seal      python3 zreflect/registry.py --verify-seal
          run_one registry-gates   python3 zreflect/registry.py --gates
          run_one facts-render     python3 zreflect/facts.py --check
          run_one wants            python3 .githooks/check-wants.py
          run_one whitelist        python3 .githooks/check-whitelist.py
          run_one consistency      python3 .githooks/check-consistency.py
          run_one readiness        python3 .githooks/check-readiness-pattern.py
          for g in check_facts check_history check_i18n check_invariants check_lint \
                   check_questions check_readme_sync check_retractions check_snapshots \
                   check_explain; do
            run_one "$g" python3 "zreflect/$g.py"
          done
          printf 'facts-replay\tSKIP (requires /mnt/hdd deploy tree)\tSKIP\n' >> results.tsv
          echo "  facts-replay: SKIP (requires /mnt/hdd deploy tree)"
          run_one facts-replay-selftest python3 zreflect/check_facts_replay.py --selftest
          run_one harness          python3 zreflect/harness.py
          run_one selftest-build   sh build/gates-selftest.sh
          run_one hook-selftest    python3 reflect-local/hook.py --selftest
          run_one ruff-check       python3 -m ruff check zreflect reflect-local
          run_one var-audit        node build/113/var-audit.mjs
          run_one release-selftest python3 build/make-release.py --selftest
          exit "$any_fail"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Code quality assessment — Octave-Full-Wasm"
            echo ""
            echo "| Check | Command | Result |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f results.tsv ]; then
            while IFS=$'\t' read -r n c rc; do
              if [ "$rc" = "0" ]; then badge="PASS"
              elif [ "$rc" = "SKIP" ]; then badge="SKIP"
              else badge="FAIL (rc=$rc)"
              fi
              printf '| %s | `%s` | %s |\n' "$n" "$c" "$badge" >> "$GITHUB_STEP_SUMMARY"
            done < results.tsv
          else
            echo "| (no results) | — | — |" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "Assessment uses each repository's existing gates (no new lint rules)."
            echo "\`check_facts_replay\`, witnesses, and \`check_stale\` require the local deploy tree and run on the maintainer machine."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-logs
          path: /tmp/*.log
          if-no-files-found: ignore
